global:
  resolve_timeout: 5m

route:
  group_by: [alertname, severity, service]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: default
      repeat_interval: 30m

receivers:
  - name: default
    # webhook_configs:
    #   - url: http://backend:8000/api/v1/webhooks/alert

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, service]
