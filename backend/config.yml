llm:
  provider: "openai"          # 개발/MVP
  model: "gpt-4o-mini"
  # provider: "claude"        # 발표용 (claude-sonnet-4-20250514)
  # model: "claude-sonnet-4-20250514"
  # provider: "ollama"        # 오프라인 데모용
  # model: "llama3"

services:
  # Docker 내부 실행 시: http://prometheus:9090, redis://redis:6379, http://langfuse:3000
  # 로컬 직접 실행 시(개발): 아래 localhost 값 사용
  prometheus_url: "http://localhost:9090"
  grafana_url: "http://localhost:3001"
  grafana_user: "admin"
  grafana_password: "admin123"
  elasticsearch_url: "http://localhost:9200"
  alertmanager_url: "http://localhost:9093"
  redis_url: "redis://localhost:6380"
  langfuse_host: "http://localhost:3002"

security:
  allowed_actions:
    - create_monitoring_target
    - create_alert_rule
    - import_dashboard
    - search_logs
    - summarize_alerts
